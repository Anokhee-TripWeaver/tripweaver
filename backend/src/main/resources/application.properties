spring.datasource.url=jdbc:mysql://localhost:3306/tripweaver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
geoapify.api.key=
aviationstack.api.key=
google.places.api.key=
openai.api.key=
amadeus.api.key=
amadeus.api.secret=
chatbot.groq.key=${GROQ_API_KEY:}
server.port=8090
# for google OAuth credentials
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8090/login/oauth2/code/google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

# Email Configuration (Gmail example)

# NOTE: For Gmail, you need an App Password if 2FA is on.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tripweaverOfficial@gmail.com
spring.mail.password=
jwt.secret=tripweaver_secret_key
jwt.expiration=86400000
spring.main.allow-bean-definition-overriding=true
